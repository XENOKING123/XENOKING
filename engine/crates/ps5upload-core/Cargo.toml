[package]
name = "ps5upload-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
blake3.workspace = true
ftx2-proto = { path = "../ftx2-proto" }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
# Read .zip game dumps and stream-decompress them straight into the FTX2
# shard pipeline (transfer.rs `transfer_zip`). Deflate-only, matching the
# pin already vetted in client/src-tauri (save_archive.rs) — no bzip2/zstd
# C libs.
zip = { version = "8", default-features = false, features = ["deflate"] }
# Read .7z game dumps (commonly a single .exfat image) the same way — host
# decompress + stream into the shard pipeline (transfer.rs `transfer_7z`).
# `default-features = false` keeps ONLY the always-on pure-Rust LZMA/LZMA2
# decoder (lzma-rust2) + crc32fast, dropping the optional bzip2 (C dep), aes/
# getrandom, ppmd, brotli and zstd defaults — so the dependency cross-compiles
# cleanly to aarch64-linux-android with no C toolchain. LZMA2 covers the
# overwhelming majority of real-world 7z game dumps; an archive using an
# unsupported codec fails with a clear "re-pack with LZMA2" message.
sevenz-rust2 = { version = "0.21", default-features = false }
# Decode user-supplied avatar images (profile.rs). Pure-Rust decoders only
# (png/jpeg/webp/bmp/gif) — no C deps, so the Android cross-compile stays
# clean, same care as the zip/sevenz pins above. We hand-roll the bilinear
# resize + DXT5/DDS encode (ported to match the PS5 reference byte-for-byte),
# so only the decode + PNG re-encode sides of `image` are exercised.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
# Save Converter (save_convert/re_engine) — read/write Monster Hunter Wilds
# DSSS save files. All pure-Rust, no C deps, so the Android cross-compile the
# pins above protect stays clean:
#   aes        — AES-128 block, driven in OFB mode by hand (no block-mode crate)
#   num-bigint — the 253-bit modular arithmetic of the PC key wrap / trailer
#   flate2 (rust_backend) — the DEFLATE layer, same miniz_oxide backend the
#                           desktop shell already uses
aes = { version = "0.9", default-features = false }
num-bigint = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Read .rar game dumps (incl. multi-volume + AES password) — host-extract to a
# temp dir, then stream via the directory transfer (transfer.rs `rar_support`).
# UnRAR is the only thing that fully handles RAR5 + multi-volume + passwords;
# the `unrar` crate bundles the UnRAR C++ source (a C dependency, built via cc).
# To keep the pure-Rust aarch64-linux-android cross-compile the zip/7z pins
# protect, RAR is desktop-ONLY: the dependency is target-gated to non-Android
# targets, and the code is `#[cfg(not(target_os = "android"))]`. This needs NO
# `--features` plumbing — desktop builds include it automatically, the Android
# target excludes it automatically (Android keeps zip/7z only). Note also: the
# UnRAR license is GPL-incompatible; see docs/rar-support-design.md for the
# distribution/licensing decision.
[target.'cfg(not(target_os = "android"))'.dependencies]
unrar = "0.5"
